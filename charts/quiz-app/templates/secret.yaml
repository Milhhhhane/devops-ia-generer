apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quiz-app.fullname" . }}-secrets
  labels:
    {{- include "quiz-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ .Values.secrets.postgresPassword }}@db:5432/{{ .Values.postgres.database }}"
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  FROM_EMAIL: {{ .Values.secrets.fromEmail | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
