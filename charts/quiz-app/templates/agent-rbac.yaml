{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quiz-app.fullname" . }}-agent
  labels:
    {{- include "quiz-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quiz-app.fullname" . }}-agent
  labels:
    {{- include "quiz-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quiz-app.fullname" . }}-agent
  labels:
    {{- include "quiz-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
subjects:
  - kind: ServiceAccount
    name: {{ include "quiz-app.fullname" . }}-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "quiz-app.fullname" . }}-agent
  apiGroup: rbac.authorization.k8s.io
{{- end }}
