{{- if .Values.agent.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "quiz-app.fullname" . }}-agent
  labels:
    {{- include "quiz-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  schedule: {{ .Values.agent.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: agent
        spec:
          serviceAccountName: {{ include "quiz-app.fullname" . }}-agent
          restartPolicy: Never
          containers:
            - name: agent
              image: "{{ .Values.image.registry }}/agent:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: NODE_EXTRA_CA_CERTS
                  value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                - name: OPENROUTER_MODEL
                  value: {{ .Values.agent.model | quote }}
                - name: OPENROUTER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "quiz-app.fullname" . }}-secrets
                      key: OPENROUTER_API_KEY
{{- end }}
